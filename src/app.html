<html lang="en" class="dark" data-o3-brand="professional">

	<title>Vesper</title>
	<link rel="icon" href="%sveltekit.assets%/favicon.png" type="image/png" />

	<meta name="viewport" content="width=device-width, initial-scale=1" />
